services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factorypulse}
      POSTGRES_USER: ${POSTGRES_USER:-factorypulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factorypulse-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-factorypulse} -d ${POSTGRES_DB:-factorypulse}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: FactoryPulse
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:-factorypulse-docker-local-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-factorypulse}:${POSTGRES_PASSWORD:-factorypulse-local-only}@db:5432/${POSTGRES_DB:-factorypulse}
      ML_MODEL_PATH: /app/ml/models/enhanced_random_forest.joblib
      ML_REPORT_PATH: /app/ml/reports/random_forest_evaluation.json
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ./ml/reports:/app/ml/reports:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/database')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: